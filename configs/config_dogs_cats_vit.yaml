# Configuration for the combined Dogs+Cats breed classifier with ViT backbone.
# 120 Stanford Dogs breeds + 12 Oxford-IIIT Pet cat breeds = 132 classes.
# Uses google/vit-base-patch16-224-in21k (loaded by src/bcs_pipeline/models/vit_transfer.py).
defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

seed: 42

experiment_name: "vit_dogs_cats"

# ── Model ────────────────────────────────────────────────────────────
model_name: "vit"
num_classes: 132

# ── Optimizer ────────────────────────────────────────────────────────
# ViT-Base needs a much lower LR than ResNet50 because the pre-trained
# weights are highly informative — large LR overwrites them.
lr: 5e-5
optimizer_name: "adam"
weight_decay: 1e-4

# ── Scheduler ────────────────────────────────────────────────────────
scheduler_config:
  name: "cosine_annealing"
  T_max: 20
  eta_min: 1e-7
  monitor: "val_loss"

# ── Regularization ───────────────────────────────────────────────────
regularization:
  dropout: 0.1
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 0.5
  stochastic_depth: 0.1

# ── Data ─────────────────────────────────────────────────────────────
dataset: "combined"
stanford_data_dir: "data/stanford_dogs/images"
oxford_data_dir: "data/Oxford-IIIT_pet_dataset"
data_dir: "data/stanford_dogs/images"
image_size: 224
# ViT-Base is heavier than ResNet50; halve the batch if a 24GB GPU OOMs.
batch_size: 64
num_workers: 8
val_split: 0.1
test_split: 0.1
# Optional: oversample minority classes (cats are 10% of dataset).
# Read by CombinedDogsCatsDataModule via cfg.balanced_sampling.
balanced_sampling: true

# ── Training ─────────────────────────────────────────────────────────
max_epochs: 120
patience: 30

task: "classification"
seg_num_classes: 3

finetuning:
  unfreeze_at_epoch: 5
  backbone_lr_multiplier: 0.1

log_every_n_steps: 10
val_check_interval: 1.0

# ViT trains well in fp16 on Ampere+ GPUs and roughly halves VRAM.
precision: "16-mixed"
gradient_clip_val: 1.0

# ── TensorBoard ──────────────────────────────────────────────────────
use_tensorboard: true
tensorboard:
  log_graph: false
  log_weight_histograms: false
  histogram_every_n_epochs: 5
  log_images: true
  log_confusion_matrix: true
  log_pr_curve: true
  log_embedding: false
use_wandb: false
wandb_project: "bcs_determination_classification"

# ── Trainer ──────────────────────────────────────────────────────────
trainer:
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  sync_batchnorm: false
  profiler: null
  resume_from_checkpoint: null

# ── Inference ────────────────────────────────────────────────────────
inference:
  checkpoint_path: null
  batch_size: 64
  save_results: true

# ── Hyper-param sweep (unused by default) ────────────────────────────
n_trials: 10
n_epochs_per_trial: 3
timeout: null

hydra:
  sweeper:
    sampler:
      seed: ${seed}
    direction: maximize
    study_name: bcs_vit_dogs_cats_study
    storage: null
    n_trials: ${n_trials}
    n_jobs: 1
    params:
      lr: choice(2e-5, 5e-5, 1e-4)
      batch_size: choice(8, 16, 32)
  run:
    dir: experiments/vit_dogs_cats/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: experiments/vit_dogs_cats/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
