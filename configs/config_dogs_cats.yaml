# Configuration parameter for the combined Dogs+Cats breed classifier.
# 120 Stanford Dogs breeds + 12 Oxford-IIIT Pet cat breeds = 132 classes.
defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

seed: 42

# ── Experiment naming (overrides the default model_name + optimizer
# combination so the dogs-only and dogs+cats checkpoints don't collide).
experiment_name: "resnet50_dogs_cats"

# ── Model ────────────────────────────────────────────────────────────
model_name: "resnet50"
num_classes: 132

# ── Optimizer ────────────────────────────────────────────────────────
lr: 0.001
optimizer_name: "adam"
weight_decay: 1e-4

# ── Scheduler ────────────────────────────────────────────────────────
scheduler_config:
  name: "cosine_annealing"
  T_max: 20
  eta_min: 1e-6
  monitor: "val_loss"

# ── Regularization ───────────────────────────────────────────────────
regularization:
  dropout: 0.3
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 0.5
  stochastic_depth: 0.1

# ── Data ─────────────────────────────────────────────────────────────
# dataset: "combined" routes to CombinedDogsCatsDataModule
dataset: "combined"
# setup_and_run.sh extracts Stanford Dogs into data/stanford_dogs/images/Images/
# (note the nested directory). This must match where ImageFolder will look.
stanford_data_dir: "data/stanford_dogs/images"
oxford_data_dir: "data/Oxford-IIIT_pet_dataset"
data_dir: "data/stanford_dogs/images"
image_size: 224
batch_size: 32
num_workers: 8
val_split: 0.1
test_split: 0.1

# ── Training ─────────────────────────────────────────────────────────
max_epochs: 100
patience: 15

task: "classification"
seg_num_classes: 3

finetuning:
  unfreeze_at_epoch: 5
  backbone_lr_multiplier: 0.1

log_every_n_steps: 10
val_check_interval: 1.0

precision: "32"
gradient_clip_val: 1.0

# ── TensorBoard ──────────────────────────────────────────────────────
use_tensorboard: true
tensorboard:
  log_graph: true
  log_weight_histograms: true
  histogram_every_n_epochs: 5
  log_images: true
  log_confusion_matrix: true
  log_pr_curve: true
  log_embedding: false
use_wandb: false
wandb_project: "bcs_determination_classification"

# ── Trainer ──────────────────────────────────────────────────────────
trainer:
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  sync_batchnorm: false
  profiler: null
  resume_from_checkpoint: null

# ── Inference ────────────────────────────────────────────────────────
inference:
  checkpoint_path: null
  batch_size: 64
  save_results: true

# ── Hyper-param sweep (unused by default) ────────────────────────────
n_trials: 10
n_epochs_per_trial: 3
timeout: null

hydra:
  sweeper:
    sampler:
      seed: ${seed}
    direction: maximize
    study_name: bcs_dogs_cats_study
    storage: null
    n_trials: ${n_trials}
    n_jobs: 1
    params:
      lr: choice(0.0001, 0.001, 0.005)
      optimizer_name: choice("adam", "sgd")
      batch_size: choice(16, 32, 64)
  run:
    dir: experiments/resnet50_dogs_cats/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: experiments/resnet50_dogs_cats/multirun_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
