# Configuration for the binary SPECIES classifier (dog vs cat), ViT backbone.
# Stage 1 of the cascade pipeline: species → breed → silhouette → BCS.
# Built on the combined Stanford Dogs + Oxford-IIIT cats data, relabelled to
# 2 classes (0=dog, 1=cat) by SpeciesClassificationDataModule.
defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

seed: 42

experiment_name: "vit_species"

# ── Model ────────────────────────────────────────────────────────────
model_name: "vit"
num_classes: 2

# ── Optimizer ────────────────────────────────────────────────────────
lr: 5e-5
optimizer_name: "adam"
weight_decay: 1e-4

# ── Scheduler ────────────────────────────────────────────────────────
scheduler_config:
  name: "cosine_annealing"
  T_max: 20
  eta_min: 1e-7
  monitor: "val_loss"

# ── Regularization ───────────────────────────────────────────────────
regularization:
  dropout: 0.1
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_prob: 0.5
  stochastic_depth: 0.1

# ── Data ─────────────────────────────────────────────────────────────
dataset: "species"
stanford_data_dir: "data/Stanford_dogs"
oxford_data_dir: "data/Oxford-IIIT_pet_dataset"
data_dir: "data/Stanford_dogs"
image_size: 224
batch_size: 64
num_workers: 8
val_split: 0.1
test_split: 0.1
# Dogs (120 breeds) hugely outnumber cats (12 breeds); balance the two species.
balanced_sampling: true

# ── Training ─────────────────────────────────────────────────────────
max_epochs: 30
patience: 8

task: "classification"
seg_num_classes: 3

finetuning:
  unfreeze_at_epoch: 5
  backbone_lr_multiplier: 0.1

log_every_n_steps: 10
val_check_interval: 1.0

precision: "16-mixed"
gradient_clip_val: 1.0

# ── TensorBoard ──────────────────────────────────────────────────────
use_tensorboard: true
tensorboard:
  log_graph: false
  log_weight_histograms: false
  histogram_every_n_epochs: 5
  log_images: true
  log_confusion_matrix: true
  log_pr_curve: true
  log_embedding: false
use_wandb: false
wandb_project: "bcs_determination_classification"

# ── Trainer ──────────────────────────────────────────────────────────
trainer:
  accelerator: "auto"
  devices: "auto"
  strategy: "auto"
  sync_batchnorm: false
  profiler: null
  resume_from_checkpoint: null

# ── Inference ────────────────────────────────────────────────────────
inference:
  checkpoint_path: null
  batch_size: 64
  save_results: true

# ── Hyper-param sweep (unused by default) ────────────────────────────
n_trials: 10
n_epochs_per_trial: 3
timeout: null

hydra:
  sweeper:
    sampler:
      seed: ${seed}
    direction: maximize
    study_name: bcs_vit_species_study
    storage: null
    n_trials: ${n_trials}
    n_jobs: 1
    params:
      lr: choice(2e-5, 5e-5, 1e-4)
      batch_size: choice(16, 32, 64)
  run:
    dir: experiments/vit_species/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: experiments/vit_species/multirun_${now:%Y-%m-%d_%H-%M-%S}
