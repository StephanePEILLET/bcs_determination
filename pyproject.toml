[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcs-pipeline"
version = "0.1.0"
description = "BCS Determination deep-learning pipeline (classification, segmentation, pose)"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pytorch-lightning>=2.0",
    "torchmetrics>=0.11",
    "transformers>=4.30",
    "ultralytics>=8.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pydantic>=2.0",
    "pillow>=9.0",
    "numpy>=1.24",
    "rich>=13.0",
    "prodict>=0.8",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "matplotlib>=3.7",
    "wandb>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bcs_pipeline = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
