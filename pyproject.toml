[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcs-pipeline"
version = "0.1.0"
description = "BCS Determination deep-learning pipeline (classification, segmentation, pose)"
# Python 3.12 is required by the SAM 3 backend (Meta SAM 3, in default deps).
# Older Python versions still work for the DeepLab / SAM 2 backends but are
# unsupported.
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    # Core DL stack
    "torch>=2.0",
    "torchvision>=0.15",
    "pytorch-lightning>=2.0",
    "torchmetrics>=0.11",
    "transformers>=4.30",
    "ultralytics>=8.0",
    "tensorboard>=2.10",
    # Config / validation
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pydantic>=2.0",
    "prodict>=0.8",
    # Images / arrays. OpenCV is pinned < 4.12 because 4.13 forces numpy ≥ 2,
    # which conflicts with the rest of the project (torch / pytorch-lightning
    # still shipping for numpy 1.x).
    "pillow>=9.0",
    "numpy>=1.24",
    "opencv-python<4.12",
    "opencv-python-headless<4.12",
    "opencv-contrib-python<4.12",
    "scikit-learn>=1.1",
    "scikit-image>=0.22",
    # Web app + persistence (FastAPI lifespan)
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "jinja2>=3.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0",
    # SAM 2 zero-shot backend (default segmenter alongside DeepLab)
    "sam2>=1.0",
    # Meta SAM 3 zero-shot, concept-grounded segmenter. Requires Python ≥ 3.12,
    # PyTorch ≥ 2.7, CUDA ≥ 12.6. Run `hf auth login` once to fetch the gated
    # checkpoint from HuggingFace.
    # einops / pycocotools / scikit-image are runtime imports of the upstream
    # `sam3` package but missing from its `dependencies`; declared here so a
    # fresh install is self-contained.
    # setuptools is pinned < 81 because upstream `sam3/model_builder.py` does
    # `import pkg_resources` at module load, and setuptools 81 dropped that
    # module from the default install. Without the pin, `import sam3` fails
    # with `ModuleNotFoundError: No module named 'pkg_resources'`.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git",
    "huggingface_hub>=0.20",
    "einops>=0.8",
    "pycocotools>=2.0",
    "setuptools<81",
    # CLI niceties
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "matplotlib>=3.7",
    "wandb>=0.15",
    # Notebooks / data exploration
    "pandas>=2.0",
    "seaborn>=0.12",
    # Hyperparameter sweeps for train.py
    "hydra-optuna-sweeper>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bcs_pipeline = ["py.typed"]

# ── uv configuration ────────────────────────────────────────────────────────
# On Linux, fetch torch / torchvision / torchaudio from the PyTorch CUDA 12.4
# wheel index (works on both GPU and CPU-only Linux hosts — the cu124 wheels
# fall back to CPU at runtime when no NVIDIA driver is present). On macOS and
# Windows, no source mapping → uv falls back to PyPI default which has
# MPS-enabled / CPU-only torch builds. `explicit = true` keeps the cu124
# index from being scanned for unrelated packages.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
