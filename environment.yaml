# Conda environment for the BCS Determination pipeline.
#
# This file provisions the Python interpreter and PyTorch with CUDA 12.4
# support. All other project dependencies live in `pyproject.toml`. After
# `conda env create -f environment.yaml`, run:
#
#     conda activate bcs_analysis
#     pip install -e ".[dev]"          # base install (DeepLab + SAM 2 backends)
#     pip install -e ".[dev,sam3]"     # full install (adds Meta SAM 3, gated)
#
# SAM 3 also requires `hf auth login` (HuggingFace token with access granted to
# `facebook/sam3`).
#
# CUDA mismatch note: pin `pytorch-cuda` to match the host driver. SAM 3's
# upstream README requires CUDA ≥ 12.6 for flash-attn-3 acceleration, but
# 12.4 is the latest stable conda channel and is sufficient for inference.
name: bcs_analysis
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - pytorch>=2.7
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
